<title>Tchac !</title>

<style>
:root {
  --bg: #EEF1F6; --surface: #FFFFFF; --ink: #1D2433; --soft: #566079; --line: #D6DCE7;
  --accent: #1D2433; --on-accent: #FFFFFF; --good: #23955A; --err: #B4232D; --err-bg: #FDE4E6;
  --rouge: #E5484D; --bleu: #2F7DE1; --jaune: #F2C12E; --vert: #2EAD5B;
  --shadow: 0 2px 0 rgba(29, 36, 51, .06), 0 14px 32px -16px rgba(29, 36, 51, .4);
  --f-title: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --f-text: "Andika", "Verdana", system-ui, sans-serif;
  --f-emo: "Noto Color Emoji", "Segoe UI Emoji", "Apple Color Emoji", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #10141C; --surface: #1A202B; --ink: #EEF1F7; --soft: #A3ADC2; --line: #2A3344; --accent: #F2C12E; --on-accent: #1D2433;
    --good: #35B36F; --err: #FF9AA2; --err-bg: #3D1C22; --shadow: 0 2px 0 rgba(0, 0, 0, .3), 0 14px 32px -16px rgba(0, 0, 0, .8); color-scheme: dark; }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-text); font-size: 16px; line-height: 1.5;
  padding: max(24px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: grid; place-items: center; }
.emo { font-family: var(--f-emo); font-style: normal; line-height: 1; }
.card { width: min(100%, 480px); background: var(--surface); border-radius: 28px; box-shadow: var(--shadow); padding: 28px 24px 22px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
.logo-img { width: 88px; height: 88px; }
h1 { font-family: var(--f-title); font-weight: 800; font-size: 2.6rem; line-height: .9; margin: 0; }
h1 b { color: var(--rouge); }
.intro { margin: 0; color: var(--soft); text-wrap: balance; }
.dots { display: flex; gap: 6px; }
.dots i { width: 14px; height: 14px; border-radius: 50%; display: block; }
form { width: 100%; display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
label { font-family: var(--f-title); font-weight: 700; font-size: 1.15rem; }
input { width: 100%; min-height: 60px; border-radius: 16px; border: 3px solid var(--line); background: var(--bg); color: var(--ink);
  font-family: var(--f-title); font-weight: 700; font-size: 1.6rem; letter-spacing: .14em; text-align: center; text-transform: uppercase; padding: 0 12px; }
input:focus { outline: none; border-color: var(--bleu); }
button, .btn { min-height: 60px; border-radius: 999px; border: 0; background: var(--accent); color: var(--on-accent); font-family: var(--f-title); font-weight: 800; font-size: 1.3rem; cursor: pointer; }
button:disabled { opacity: .6; cursor: default; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--bleu); outline-offset: 3px; }
.msg { min-height: 1.5em; margin: 0; font-weight: 700; }
.msg.err { color: var(--err); background: var(--err-bg); border-radius: 12px; padding: 8px 12px; }
.small { margin: 0; font-size: .9rem; color: var(--soft); }
.menu { width: 100%; display: grid; gap: 10px; }
.choix { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 4px 14px; text-align: left; min-height: 76px; padding: 12px 18px; border-radius: 20px;
  border: 2px solid var(--line); background: var(--bg); color: var(--ink); font-family: var(--f-text); font-weight: 400; font-size: 1rem; }
.choix .emo { grid-row: 1 / 3; font-size: 2rem; }
.choix b { font-family: var(--f-title); font-weight: 800; font-size: 1.2rem; line-height: 1.1; }
.choix span.s { color: var(--soft); font-size: .9rem; line-height: 1.3; }
.choix.principal { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.choix.principal span.s { color: inherit; opacity: .85; }
.pc { width: 100%; text-align: left; background: var(--bg); border: 2px dashed var(--line); border-radius: 20px; padding: 12px 18px; font-size: .95rem; }
.pc b { font-family: var(--f-title); }
.pc a { color: inherit; font-weight: 700; }
.oublier { background: none; color: var(--soft); min-height: 40px; font-family: var(--f-text); font-weight: 400; font-size: .9rem; text-decoration: underline; }
</style>

<script>
(function () {
  'use strict';
  var CLE_STOCKAGE = 'tchac:acces';
  var D = JSON.parse(document.getElementById('donnees').textContent);
  // Pas d'APK publié (ex. après une nouvelle clé, avant que l'appli Android soit refaite) : pas de bouton.
  if (!D.fichiers || !D.fichiers.apk) { var bApk = document.querySelector('[data-choix="apk"]'); if (bApk) bApk.remove(); }
  var form = document.getElementById('f'), input = document.getElementById('code'), btn = document.getElementById('go');
  var msg = document.getElementById('msg'), menu = document.getElementById('menu'), oublier = document.getElementById('oublier');
  var cleContenu = null;

  function b64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function norm(s) { return String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); }
  function dire(t, err) { msg.textContent = t; msg.className = 'msg' + (err ? ' err' : ''); }
  function lu() { try { var v = localStorage.getItem(CLE_STOCKAGE); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
  function garder(c) { try { localStorage.setItem(CLE_STOCKAGE, JSON.stringify(c)); } catch (e) {} }
  function effacer() { try { localStorage.removeItem(CLE_STOCKAGE); } catch (e) {} }

  // La clé du contenu est chiffrée une fois par code (PBKDF2 puis AES-GCM) : un bon code la retrouve.
  async function deverrouiller(code) {
    var s = crypto.subtle;
    var base = await s.importKey('raw', new TextEncoder().encode(norm(code)), 'PBKDF2', false, ['deriveKey']);
    var kek = await s.deriveKey({ name: 'PBKDF2', salt: b64(D.sel), iterations: D.tours, hash: 'SHA-256' }, base,
      { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    for (var i = 0; i < D.cles.length; i++) {
      try {
        var brut = await s.decrypt({ name: 'AES-GCM', iv: b64(D.cles[i].iv) }, kek, b64(D.cles[i].c));
        return await s.importKey('raw', brut, 'AES-GCM', false, ['decrypt']);
      } catch (e) {}
    }
    return null;
  }

  // Fichier .verrou : 12 octets d'IV, puis le contenu chiffré (AES-256-GCM).
  async function dechiffrer(octets) {
    var u = new Uint8Array(octets);
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: u.slice(0, 12) }, cleContenu, u.slice(12));
  }

  function ouvrirMenu() {
    form.hidden = true; menu.hidden = false; oublier.hidden = false;
    document.getElementById('note').hidden = true;
  }

  async function telecharger(fichier, nom, type, bouton) {
    bouton.disabled = true; dire('Téléchargement…');
    try {
      var r = await fetch(fichier, { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      var clair = await dechiffrer(await r.arrayBuffer());
      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([clair], { type: type }));
      a.download = nom;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 60000);
      dire(nom + ' est téléchargé.');
    } catch (e) {
      dire('Le téléchargement n\'a pas marché. Vérifie la connexion et réessaie.', true);
    }
    bouton.disabled = false;
  }

  menu.addEventListener('click', async function (e) {
    var b = e.target.closest('[data-choix]'); if (!b) return;
    var choix = b.dataset.choix;
    if (choix === 'jouer') {
      dire('Ouverture…');
      try {
        var html = new TextDecoder().decode(await dechiffrer(b64(D.appli).buffer));
        document.open(); document.write(html); document.close();
      } catch (err) { dire('Un problème est survenu. Recharge la page et réessaie.', true); }
    } else if (choix === 'apk') {
      telecharger(D.fichiers.apk, 'XDKTchac.apk', 'application/vnd.android.package-archive', b);
    } else if (choix === 'pdf') {
      telecharger(D.fichiers.pdf, 'Tchac_cartes.pdf', 'application/pdf', b);
    }
  });

  oublier.addEventListener('click', function () { effacer(); location.reload(); });

  if (!window.crypto || !crypto.subtle) {
    dire('Ce navigateur est trop ancien. Ouvre la page avec Chrome, Edge, Firefox ou Safari à jour.', true);
    btn.disabled = true; return;
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    var c = norm(input.value);
    if (c.length < 4) { dire('Tape le code reçu (par exemple ABCD-2345).', true); input.focus(); return; }
    btn.disabled = true; dire('Vérification…');
    try {
      cleContenu = await deverrouiller(c);
      if (cleContenu) { garder(c); dire(''); ouvrirMenu(); return; }
      dire('Ce code ne marche pas. Vérifie les lettres et les chiffres, puis réessaie.', true);
    } catch (err) { dire('Un problème est survenu. Recharge la page et réessaie.', true); }
    btn.disabled = false; input.select();
  });

  var dejaLa = lu();
  if (dejaLa) {
    form.hidden = true; dire('Ouverture…');
    deverrouiller(dejaLa).then(function (k) {
      if (k) { cleContenu = k; dire(''); ouvrirMenu(); }
      else { effacer(); form.hidden = false; dire('Le code de cet appareil ne marche plus. Tape le nouveau code.', true); }
    }).catch(function () { effacer(); form.hidden = false; dire(''); });
  }
})();
</script>
